<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#024B83" />
      <stop offset="100%" stop-color="#012E52" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB33B" />
      <stop offset="100%" stop-color="#E5941A" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Rounded Background (PWA safe) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle tech circles in background -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E5941A" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="10, 10" />

  <!-- Main Tech Icon Group -->
  <g transform="translate(0, -10)">
    <!-- Sleek Laptop Graphic -->
    <!-- Laptop Screen/Bezel -->
    <rect x="136" y="160" width="240" height="150" rx="12" fill="#0c1e30" stroke="#ffffff" stroke-width="6" />
    <!-- Screen Inner Glow Area -->
    <rect x="148" y="172" width="216" height="114" rx="6" fill="#01233d" />
    
    <!-- Stylized Circuit Wrench in the Center -->
    <g transform="translate(256, 225) scale(0.95)" filter="url(#glow)">
      <!-- Wrench head -->
      <path d="M -30,-30 C -10,-50 10,-50 30,-30 C 45,-15 45,15 30,30 C 20,40 5,45 -5,45 L -5,90 L -15,90 L -15,45 C -25,41 -32,35 -38,28 Z" fill="url(#accentGrad)" />
      <!-- Wrench cutout -->
      <path d="M -16,-16 L 0,-32 L 16,-16 L 0,0 Z" fill="#01233d" />
      
      <!-- Microchip nodes inside the screen -->
      <circle cx="-60" cy="-20" r="5" fill="#E5941A" />
      <line x1="-60" y1="-20" x2="-35" y2="-20" stroke="#E5941A" stroke-width="2" />
      
      <circle cx="60" cy="-20" r="5" fill="#E5941A" />
      <line x1="60" y1="-20" x2="35" y2="-20" stroke="#E5941A" stroke-width="2" />

      <!-- Glowing status light -->
      <circle cx="0" cy="-45" r="7" fill="#22c55e" />
    </g>

    <!-- Laptop Base/Keyboard part -->
    <path d="M 96,310 L 416,310 C 428,310 432,318 424,324 L 396,344 C 390,348 380,350 372,350 L 140,350 C 132,350 122,348 116,344 L 88,324 C 80,318 84,310 96,310 Z" fill="#e2e8f0" />
    <!-- Keyboard Trackpad groove -->
    <rect x="226" y="338" width="60" height="8" rx="3" fill="#cbd5e1" />
    <!-- Opening notch -->
    <rect x="236" y="310" width="40" height="4" rx="1" fill="#94a3b8" />
  </g>

  <!-- Typography: Al-Madar -->
  <text x="256" y="420" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">AL-MADAR</text>
  <text x="256" y="455" font-family="'Cairo', 'Inter', system-ui, sans-serif" font-weight="bold" font-size="20" fill="#E5941A" text-anchor="middle" letter-spacing="1">المدار للكمبيوتر</text>
</svg>
